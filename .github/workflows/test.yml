name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Rust Nightly Tests ${{matrix.os == 'windows' && '(windows)' || ''}}
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test
      - run: cargo test --features tokio-io --tests -- --skip ui --exact
      - run: cargo test --features value --tests -- --skip ui --exact
      - run: cargo test --features all --tests -- --skip ui --exact

  build:
    name: Rust ${{matrix.rust}} ${{matrix.os == 'windows' && '(windows)' || ''}}
    runs-on: ${{matrix.os}}-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [beta, 1.76.0]
        os: [ubuntu]
        include:
          - rust: stable
            os: ubuntu
            target: aarch64-unknown-none
          - rust: stable
            os: windows
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          targets: ${{matrix.target}}
      - uses: r7kamura/rust-problem-matchers@v1.5.0
      - run: cargo check
      - run: cargo check --features tokio-io
      - run: cargo check --features value
      - run: cargo check --features all

  # this fails right now because of errors in get-size-derive.
  # number-general should require 0.1.3
  #   minimal:
  #     name: Minimal versions
  #     runs-on: ubuntu-latest
  #     timeout-minutes: 45
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: dtolnay/rust-toolchain@nightly
  #       - run: cargo generate-lockfile -Z minimal-versions
  #       - run: cargo check --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done
      - uses: dtolnay/rust-toolchain@clippy
      - run: cargo clippy --tests # -- -Dclippy::all -Dclippy::pedantic
      - run: cargo clippy --all-features --tests # -- -Dclippy::all -Dclippy::pedantic

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - run: cargo docs-rs

  # fuzz testing async code seems hard
  #   fuzz:
  #     name: Fuzz
  #     runs-on: ubuntu-latest
  #     timeout-minutes: 45
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: dtolnay/rust-toolchain@nightly
  #       - uses: dtolnay/install@cargo-fuzz
  #       - run: cargo fuzz check

  outdated:
    name: Outdated
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap local path dependencies
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          queue=("$PWD")
          seen["$PWD"]=1

          while ((${#queue[@]})); do
            dir="${queue[0]}"
            queue=("${queue[@]:1}")

            while IFS= read -r cargo; do
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                dep_dir="$(cd "$dir/.." && pwd)/$dep"

                if [[ ! -d "$dep_dir" ]]; then
                  echo "Cloning dependency repo: $dep"
                  git clone --depth 1 "https://github.com/TinyChain-Inc/$dep.git" "$dep_dir"
                fi

                if [[ -z "${seen[$dep_dir]+x}" ]]; then
                  queue+=("$dep_dir")
                  seen["$dep_dir"]=1
                fi
              done < <(
                grep -hoE 'path[[:space:]]*=[[:space:]]*"\.\./[^"]+"' "$cargo" \
                  | sed -E 's/.*"\.\.\/([^"]+)".*/\1/' \
                  | sort -u || true
              )
            done < <(find "$dir" -name Cargo.toml -type f)
          done
      - uses: dtolnay/install@cargo-outdated
      - run: cargo outdated --exit-code 1
